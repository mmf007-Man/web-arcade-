<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>👾 웹 오락실 (9:16 모바일 단일 실행용)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #070a12;
      --bg-card: #131927;
      --bg-card-hover: #1c2539;
      --accent-neon: #38bdf8;
      --accent-purple: #a855f7;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-radius: 20px;
      --mobile-width: 430px;
      --mobile-aspect-ratio: 9 / 16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .mobile-app-wrapper {
      width: 100%;
      max-width: var(--mobile-width);
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      background-color: #0b0f19;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }

    @media (min-height: 700px) and (min-width: 480px) {
      body { padding: 20px 0; }
      .mobile-app-wrapper {
        min-height: calc(100vh - 40px);
        max-height: 920px;
        aspect-ratio: var(--mobile-aspect-ratio);
        border-radius: 36px;
        border: 2px solid rgba(56, 189, 248, 0.3);
      }
    }

    .arcade-header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 18px;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .arcade-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .arcade-tagline { font-size: 0.72rem; color: var(--text-secondary); }

    .arcade-container {
      padding: 16px 14px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hero-banner {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: var(--border-radius);
      padding: 16px;
    }

    .hero-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; }
    .hero-subtitle { color: var(--text-secondary); font-size: 0.78rem; line-height: 1.4; }

    .section-title { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

    .game-grid { display: flex; flex-direction: column; gap: 14px; }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: row;
      height: 105px;
    }

    .game-card:active, .game-card:hover {
      transform: scale(0.98);
      border-color: var(--accent-neon);
      background: var(--bg-card-hover);
    }

    .card-thumbnail {
      width: 95px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      flex-shrink: 0;
    }

    .card-body {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      overflow: hidden;
    }

    .card-category { font-size: 0.65rem; font-weight: 700; color: var(--accent-neon); text-transform: uppercase; }
    .card-title { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-desc { font-size: 0.74rem; color: var(--text-secondary); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: var(--text-secondary); }
    .play-badge { background: rgba(56, 189, 248, 0.15); color: var(--accent-neon); padding: 3px 8px; border-radius: 12px; font-weight: 700; }

    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; padding: 8px;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-window {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius);
      width: 100%; height: 100%; max-height: 98%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .modal-header { padding: 10px 14px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .modal-title { font-size: 0.98rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .modal-close-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 1.4rem; cursor: pointer; padding: 2px 6px; }
    .modal-content { padding: 8px 10px; overflow-y: auto; display: flex; justify-content: center; align-items: center; flex: 1; }

    /* 지뢰찾기 */
    .ms-game-container { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .ms-difficulty-selector { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .ms-difficulty-btn { background: #334155; border: 1px solid #475569; color: #f8fafc; padding: 5px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .ms-difficulty-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
    .ms-game-header { width: 100%; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.6); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .ms-status-box { display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 700; }
    .ms-reset-btn { background: #334155; border: 1px solid #475569; color: #f8fafc; font-size: 1.2rem; padding: 3px 8px; border-radius: 8px; cursor: pointer; }
    .ms-board { display: grid; gap: 2px; background-color: #1e293b; padding: 6px; border-radius: 8px; border: 2px solid #334155; overflow-x: auto; max-width: 100%; }
    .ms-cell { width: 30px; height: 30px; background-color: #334155; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 0.9rem; cursor: pointer; }
    .ms-cell.revealed { background-color: #1e293b; cursor: default; }
    .ms-cell.mine { background-color: #ef4444 !important; }
    .ms-cell.flagged { color: #f59e0b; }
    .ms-cell[data-count="1"] { color: #38bdf8; } .ms-cell[data-count="2"] { color: #4ade80; } .ms-cell[data-count="3"] { color: #f87171; }

    /* 스네이크 */
    .snake-container { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #f8fafc; width: 100%; }
    .snake-score-board { display: flex; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: bold; }
    .snake-canvas { background-color: #0f172a; border: 2px solid #38bdf8; border-radius: 8px; max-width: 100%; height: auto; }
    .snake-btn { background: #38bdf8; color: #0f172a; border: none; padding: 6px 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }

    /* 테트리스 콤팩트 */
    .tetris-container { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #f8fafc; width: 100%; max-height: 100%; user-select: none; -webkit-user-select: none; }
    .tetris-dashboard { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 220px; background: rgba(15, 23, 42, 0.7); padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08); }
    .tetris-score-info { display: flex; flex-direction: column; gap: 2px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: bold; }
    .tetris-next-box { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; color: #38bdf8; font-weight: bold; }
    .tetris-next-canvas { background-color: #0f172a; border: 1px solid #475569; border-radius: 6px; }
    .tetris-canvas { background-color: #0f172a; border: 2px solid #a855f7; border-radius: 8px; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); touch-action: none !important; -webkit-user-select: none; user-select: none; }
    .tetris-gesture-guide { background: rgba(168, 85, 247, 0.1); border: 1px dashed rgba(168, 85, 247, 0.3); border-radius: 8px; padding: 6px 10px; width: 100%; max-width: 220px; font-size: 0.7rem; }
    .tetris-gesture-guide p { color: #a855f7; margin-bottom: 2px; }
    .tetris-gesture-guide ul { list-style: none; display: flex; flex-direction: column; gap: 1px; color: #94a3b8; }
    .t-btn-wide { width: 100%; max-width: 220px; background: #a855f7; color: #0f172a; border: none; padding: 8px; font-size: 0.9rem; font-weight: bold; border-radius: 8px; cursor: pointer; }

    /* 똥 피하기 (Avoid Poop) */
    .dp-game-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px; margin: 0 auto; position: relative; user-select: none; font-family: 'Pretendard', sans-serif; color: #f8fafc; }
    .dp-header { width: 100%; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 14px; border-radius: 14px; margin-bottom: 10px; }
    .dp-score-box { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1rem; }
    .dp-target-badge { font-size: 0.75rem; color: #94a3b8; background: rgba(255, 255, 255, 0.08); padding: 2px 6px; border-radius: 6px; }
    .dp-sound-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: #f8fafc; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .dp-progress-wrap { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
    .dp-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f59e0b, #fbbf24); border-radius: 999px; transition: width 0.3s ease; }
    .dp-canvas-wrap { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 440px; background: #0f172a; border: 2px solid rgba(56, 189, 248, 0.3); border-radius: 18px; overflow: hidden; }
    .dp-canvas { width: 100%; height: 100%; display: block; }
    .dp-overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(6px); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; z-index: 10; }
    .dp-overlay.hidden { display: none; }
    .dp-overlay-icon { font-size: 3.5rem; margin-bottom: 8px; }
    .dp-overlay-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 8px; }
    .dp-overlay-desc { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; margin-bottom: 18px; }
    .dp-result-score { font-size: 1.1rem; font-weight: 700; color: #fbbf24; margin-bottom: 16px; background: rgba(251, 191, 36, 0.1); padding: 6px 14px; border-radius: 10px; }
    .dp-btn-primary { background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #ffffff; border: none; padding: 12px 28px; font-size: 0.95rem; font-weight: 800; border-radius: 12px; cursor: pointer; }
    .dp-controls { width: 100%; display: flex; justify-content: space-between; gap: 16px; margin-top: 14px; }
    .dp-touch-btn { flex: 1; background: #1e293b; border: 2px solid #334155; color: #f8fafc; padding: 14px 0; border-radius: 14px; font-size: 1.3rem; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
    .dp-touch-btn:active, .dp-touch-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; transform: scale(0.96); }
    .dp-keyboard-hint { font-size: 0.75rem; color: #64748b; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="mobile-app-wrapper">
    <header class="arcade-header">
      <div class="arcade-logo">
        <span>🕹️</span> ARCADE LOUNGE
      </div>
      <div class="arcade-tagline">
        9:16 모바일 단일 실행 전용 웹 오락실
      </div>
    </header>

    <main class="arcade-container">
      <section class="hero-banner">
        <h1 class="hero-title">MOBILE ARCADE 🎮</h1>
        <p class="hero-subtitle">
          더블클릭만으로 즉시 구동되는 9:16 모바일 스마트폰 비율의 웹 오락실입니다.
        </p>
      </section>

      <section>
        <h2 class="section-title">
          <span>🎯</span> 게임 카탈로그 (<span id="game-count">0</span>)
        </h2>
        <div class="game-grid" id="game-grid"></div>
      </section>
    </main>

    <div class="modal-overlay" id="game-modal">
      <div class="modal-window">
        <div class="modal-header">
          <div class="modal-title">
            <span>🎮</span> <span id="modal-game-name">게임 제목</span>
          </div>
          <button class="modal-close-btn" id="modal-close-btn">&times;</button>
        </div>
        <div class="modal-content" id="modal-game-container"></div>
      </div>
    </div>
  </div>

  <script>
    // --- 1. 지뢰찾기 ---
    class MinesweeperGamePlugin {
      constructor() {
        this.container = null; this.level = 'EASY';
        this.rows = 9; this.cols = 9; this.totalMines = 10;
        this.board = []; this.isFirst = true; this.isGameOver = false; this.isWin = false;
        this.flagCount = 0; this.revealedCount = 0; this.timerSec = 0; this.timerId = null;
      }
      mount(container) { this.container = container; this.reset(); }
      unmount() { this.stopTimer(); if (this.container) this.container.innerHTML = ''; }
      reset() {
        this.stopTimer(); this.timerSec = 0; this.isFirst = true; this.isGameOver = false; this.isWin = false;
        this.flagCount = 0; this.revealedCount = 0;
        this.board = Array.from({ length: this.rows }, () =>
          Array.from({ length: this.cols }, () => ({ isMine: false, isRevealed: false, isFlagged: false, neighborMines: 0 }))
        );
        this.renderUI();
      }
      renderUI() {
        this.container.innerHTML = `
          <div class="ms-game-container">
            <div class="ms-difficulty-selector">
              <button class="ms-difficulty-btn ${this.level==='EASY'?'active':''}" onclick="currentGame.changeLevel('EASY',9,9,10)">초급 (9x9)</button>
              <button class="ms-difficulty-btn ${this.level==='MEDIUM'?'active':''}" onclick="currentGame.changeLevel('MEDIUM',16,16,40)">중급 (16x16)</button>
              <button class="ms-difficulty-btn ${this.level==='HARD'?'active':''}" onclick="currentGame.changeLevel('HARD',16,30,99)">상급 (16x30)</button>
            </div>
            <div class="ms-game-header">
              <div class="ms-status-box">🚩 <span id="ms-mines">${this.totalMines - this.flagCount}</span></div>
              <button class="ms-reset-btn" onclick="currentGame.reset()">${this.isGameOver?(this.isWin?'😎':'😵'):'🙂'}</button>
              <div class="ms-status-box">⏱️ <span id="ms-timer">${String(this.timerSec).padStart(3,'0')}</span></div>
            </div>
            <div class="ms-board" id="ms-board"></div>
          </div>
        `;
        this.renderBoard();
      }
      changeLevel(lvl, r, c, m) { this.level = lvl; this.rows = r; this.cols = c; this.totalMines = m; this.reset(); }
      renderBoard() {
        const boardEl = this.container.querySelector('#ms-board');
        if (!boardEl) return;
        boardEl.style.gridTemplateColumns = `repeat(${this.cols}, 30px)`;
        boardEl.innerHTML = '';
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const cell = this.board[r][c];
            const div = document.createElement('div');
            div.className = 'ms-cell';
            if (cell.isRevealed) {
              div.classList.add('revealed');
              if (cell.isMine) { div.classList.add('mine'); div.textContent = '💣'; }
              else if (cell.neighborMines > 0) { div.dataset.count = cell.neighborMines; div.textContent = cell.neighborMines; }
            } else if (cell.isFlagged) {
              div.classList.add('flagged'); div.textContent = '🚩';
            }
            div.addEventListener('click', () => this.clickCell(r, c));
            div.addEventListener('contextmenu', (e) => { e.preventDefault(); this.rightClickCell(r, c); });
            boardEl.appendChild(div);
          }
        }
      }
      clickCell(r, c) {
        if (this.isGameOver || this.board[r][c].isFlagged || this.board[r][c].isRevealed) return;
        if (this.isFirst) { this.genMines(r, c); this.isFirst = false; this.startTimer(); }
        const cell = this.board[r][c];
        cell.isRevealed = true; this.revealedCount++;
        if (cell.isMine) { this.isGameOver = true; this.stopTimer(); this.revealMines(); this.renderUI(); return; }
        if (cell.neighborMines === 0) {
          const q = [[r, c]];
          while (q.length > 0) {
            const [cr, cc] = q.shift();
            this.getNeighbors(cr, cc).forEach(([nr, nc]) => {
              const n = this.board[nr][nc];
              if (!n.isRevealed && !n.isFlagged) {
                n.isRevealed = true; this.revealedCount++;
                if (n.neighborMines === 0) q.push([nr, nc]);
              }
            });
          }
        }
        if (this.revealedCount === this.rows * this.cols - this.totalMines) {
          this.isGameOver = true; this.isWin = true; this.stopTimer(); alert(`🎉 승리했습니다! (${this.timerSec}초)`);
        }
        this.renderUI();
      }
      rightClickCell(r, c) {
        if (this.isGameOver || this.board[r][c].isRevealed) return;
        const cell = this.board[r][c];
        if (!cell.isFlagged && this.flagCount >= this.totalMines) return;
        cell.isFlagged = !cell.isFlagged; this.flagCount += cell.isFlagged ? 1 : -1;
        this.renderUI();
      }
      genMines(sr, sc) {
        let p = 0;
        while (p < this.totalMines) {
          const r = Math.floor(Math.random() * this.rows), c = Math.floor(Math.random() * this.cols);
          if (!this.board[r][c].isMine && !(Math.abs(r - sr) <= 1 && Math.abs(c - sc) <= 1)) {
            this.board[r][c].isMine = true; p++;
          }
        }
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            if (this.board[r][c].isMine) continue;
            let cnt = 0;
            this.getNeighbors(r, c).forEach(([nr, nc]) => { if (this.board[nr][nc].isMine) cnt++; });
            this.board[r][c].neighborMines = cnt;
          }
        }
      }
      getNeighbors(r, c) {
        const res = [];
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) res.push([nr, nc]);
          }
        }
        return res;
      }
      revealMines() {
        for (let r = 0; r < this.rows; r++)
          for (let c = 0; c < this.cols; c++)
            if (this.board[r][c].isMine) this.board[r][c].isRevealed = true;
      }
      startTimer() { this.stopTimer(); this.timerId = setInterval(() => { this.timerSec++; const el = this.container.querySelector('#ms-timer'); if (el) el.textContent = String(this.timerSec).padStart(3,'0'); }, 1000); }
      stopTimer() { if (this.timerId) clearInterval(this.timerId); this.timerId = null; }
    }

    // --- 2. 스네이크 ---
    class SnakeGamePlugin {
      constructor() {
        this.container = null; this.gridSize = 18; this.tileCount = 14;
        this.snake = [{ x: 7, y: 7 }]; this.food = { x: 3, y: 3 };
        this.dx = 1; this.dy = 0; this.score = 0; this.interval = null;
        this.onKey = this.onKey.bind(this);
      }
      mount(container) {
        this.container = container;
        this.container.innerHTML = `
          <div class="snake-container">
            <div class="snake-score-board">점수: <span id="snake-score">0</span></div>
            <canvas id="snake-canvas" width="252" height="252" class="snake-canvas"></canvas>
            <button class="snake-btn" onclick="currentGame.reset()">다시 시작</button>
            <p style="font-size:0.75rem;color:#94a3b8;">키보드 방향키(↑ ↓ ← →)로 조종하세요.</p>
          </div>
        `;

                <h2 class="lc-overlay-title" style="color:#f87171;">GAME OVER</h2>
                <p class="lc-overlay-desc">통나무에 맞았습니다!</p>
                <button class="lc-btn-primary" id="lc-btn-retry">다시 하기 🔄</button>
              </div>
              <div class="lc-overlay hidden" id="lc-overlay-victory">
                <div class="lc-overlay-icon">🏆🕺</div>
                <h2 class="lc-overlay-title" style="color:#4ade80;">MISSION CLEAR!</h2>
                <p class="lc-overlay-desc">정상 탈출 성공!</p>
                <button class="lc-btn-primary" id="lc-btn-restart">다시 하기 🔄</button>
              </div>
            </div>
            <div class="lc-controls">
              <button class="lc-touch-btn lc-btn-up" id="lc-btn-up">▲ 위로 (등반)</button>
              <button class="lc-touch-btn lc-btn-left" id="lc-btn-left">◀ 왼쪽 점프</button>
              <button class="lc-touch-btn lc-btn-down" id="lc-btn-down">▼ 아래로 (하강)</button>
              <button class="lc-touch-btn lc-btn-right" id="lc-btn-right">오른쪽 점프 ▶</button>
            </div>
            <p class="lc-keyboard-hint">PC: 방향키(↑ ↓ ← →) 또는 [W],[S],[A],[D]</p>
          </div>
        `;
        this.canvas = this.container.querySelector('#lc-canvas');
        this.ctx = this.canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = this.vWidth * dpr; this.canvas.height = this.vHeight * dpr;
        this.ctx.scale(dpr, dpr);

        this.readyOverlay = this.container.querySelector('#lc-overlay-ready');
        this.gameOverOverlay = this.container.querySelector('#lc-overlay-gameover');
        this.victoryOverlay = this.container.querySelector('#lc-overlay-victory');
        this.progressBar = this.container.querySelector('#lc-progress-bar');
        this.soundBtn = this.container.querySelector('#lc-sound-btn');

        this.bindEvents();
        this.setGameState('READY');
        this.startLoop();
      }
      unmount() { this.stopLoop(); this.unbindEvents(); if (this.container) this.container.innerHTML = ''; }
      bindEvents() {
        window.addEventListener('keydown', this.onKeyDown);
        window.addEventListener('keyup', this.onKeyUp);
        this.container.querySelector('#lc-btn-start').addEventListener('click', () => this.startGame());
        this.container.querySelector('#lc-btn-retry').addEventListener('click', () => this.startGame());
        this.container.querySelector('#lc-btn-restart').addEventListener('click', () => this.startGame());
        this.soundBtn.addEventListener('click', () => {
          this.isMuted = !this.isMuted;
          this.soundBtn.textContent = this.isMuted ? '🔇' : '🔊';
        });
        const btnU = this.container.querySelector('#lc-btn-up'), btnD = this.container.querySelector('#lc-btn-down');
        const btnL = this.container.querySelector('#lc-btn-left'), btnR = this.container.querySelector('#lc-btn-right');
        const b = (btn, k) => {
          const s = (e) => { e.preventDefault(); this.keys[k] = true; btn.classList.add('active'); };
          const e = (ev) => { ev.preventDefault(); this.keys[k] = false; btn.classList.remove('active'); };
          btn.addEventListener('mousedown', s); btn.addEventListener('mouseup', e); btn.addEventListener('mouseleave', e);
          btn.addEventListener('touchstart', s, { passive: false }); btn.addEventListener('touchend', e, { passive: false });
        };
        b(btnU, 'up'); b(btnD, 'down'); b(btnL, 'left'); b(btnR, 'right');
      }
      unbindEvents() { window.removeEventListener('keydown', this.onKeyDown); window.removeEventListener('keyup', this.onKeyUp); }
      onKeyDown(e) {
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','s','S','a','A','d','D'].includes(e.key)) e.preventDefault();
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') this.keys.up = true;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') this.keys.down = true;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = true;
      }
      onKeyUp(e) {
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','s','S','a','A','d','D'].includes(e.key)) e.preventDefault();
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') this.keys.up = false;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') this.keys.down = false;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = false;
      }
      setGameState(st) {
        this.gameState = st;
        this.readyOverlay.classList.toggle('hidden', st !== 'READY');
        this.gameOverOverlay.classList.toggle('hidden', st !== 'GAMEOVER');
        this.victoryOverlay.classList.toggle('hidden', st !== 'VICTORY');
      }
      startGame() {
        this.logs = []; this.particles = []; this.floatingTexts = [];
        this.logSpawnTimer = 0; this.lastTime = 0;
        this.player.ladderIndex = 2; this.player.x = this.ladderXList[2]; this.player.y = this.bottomY; this.player.facing = 1; this.player.animFrame = 0;
        this.player.isClimbing = false; this.player.isFastDown = false; this.player.isJumping = false; this.player.jumpProgress = 0;
        this.player.jumpStartX = this.ladderXList[2]; this.player.jumpTargetX = this.ladderXList[2];
        this.player.fallAngle = 0; this.player.danceTimer = 0;
        this.updateUI(); this.setGameState('PLAYING');
      }
      updateUI() {
        const p = Math.min(100, Math.max(0, ((this.bottomY - this.player.y) / (this.bottomY - this.topY)) * 100));
        this.progressBar.style.width = `${p}%`;
      }
      startLoop() { if (!this.animId) { this.lastTime = 0; this.animId = requestAnimationFrame(this.loop); } }
      stopLoop() { if (this.animId) { cancelAnimationFrame(this.animId); this.animId = null; } this.lastTime = 0; }
      loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp || performance.now();
        const elapsed = timestamp ? (timestamp - this.lastTime) : 16.667;
        this.lastTime = timestamp || performance.now();
        const dt = Math.min(2.0, Math.max(0.1, elapsed / 16.667));
        this.update(dt); this.draw();
        this.animId = requestAnimationFrame(this.loop);
      }
      update(dt = 1.0) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const pt = this.particles[i]; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += (pt.gravity || 0) * dt;
          if (pt.rot !== undefined) pt.rot += (pt.vRot || 0) * dt; pt.life -= dt; pt.alpha = Math.max(0, pt.life / 30);
          if (pt.life <= 0) this.particles.splice(i, 1);
        }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i]; ft.y += ft.vy * dt; ft.life -= dt; ft.alpha = Math.max(0, ft.life / 30);
          if (ft.life <= 0) this.floatingTexts.splice(i, 1);
        }
        if (this.gameState === 'READY') { this.player.animFrame += 0.05 * dt; return; }
        if (this.gameState === 'GAMEOVER') { if (this.player.fallAngle < Math.PI / 2) this.player.fallAngle += 0.12 * dt; return; }
        if (this.gameState === 'VICTORY') {
          this.player.danceTimer += 0.1 * dt;
          if (Math.random() < 0.35 * dt) {
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#fbbf24', '#a855f7'];
            this.particles.push({ x: Math.random() * 360, y: -10, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3, gravity: 0.05, size: 4 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)], alpha: 1, life: 60 });
          }
          return;
        }

        this.player.isClimbing = false; this.player.isFastDown = false;
        if (this.keys.up) { this.player.y -= this.player.speedUp * dt; this.player.isClimbing = true; this.playSound('climb'); }
        if (this.keys.down) { this.player.y += this.player.speedDownFast * dt; this.player.isFastDown = true; this.playSound('fastDown'); }

        if (this.keys.left && !this.player.isJumping) {
          if (this.player.ladderIndex > 0) {
            this.player.ladderIndex--; this.player.isJumping = true; this.player.jumpProgress = 0;
            this.player.jumpStartX = this.player.x; this.player.jumpTargetX = this.ladderXList[this.player.ladderIndex];
            this.player.facing = -1; this.playSound('hop');
          }
          this.keys.left = false;
        }
        if (this.keys.right && !this.player.isJumping) {
          if (this.player.ladderIndex < this.ladderXList.length - 1) {
            this.player.ladderIndex++; this.player.isJumping = true; this.player.jumpProgress = 0;
            this.player.jumpStartX = this.player.x; this.player.jumpTargetX = this.ladderXList[this.player.ladderIndex];
            this.player.facing = 1; this.playSound('hop');
          }
          this.keys.right = false;
        }

        if (this.player.isJumping) {
          this.player.jumpProgress += 0.15 * dt;
          if (this.player.jumpProgress >= 1) {
            this.player.jumpProgress = 1; this.player.isJumping = false; this.player.x = this.player.jumpTargetX;
          } else {
            this.player.x = this.player.jumpStartX + (this.player.jumpTargetX - this.player.jumpStartX) * this.player.jumpProgress;
          }
        }

        if (this.player.y > this.bottomY) this.player.y = this.bottomY;
        if (this.player.y < this.topY) this.player.y = this.topY;

        this.player.animFrame = (this.player.isClimbing || this.player.isJumping || this.player.isFastDown) ? this.player.animFrame + 0.2 * dt : 0;
        this.updateUI();

        if (this.player.y <= this.topY) {
          this.setGameState('VICTORY'); this.playSound('victory');
          this.floatingTexts.push({ text: '🏆 미션 성공!', x: 180, y: 120, vy: -1.5, alpha: 1, color: '#4ade80', life: 30 });
          return;
        }

        this.logSpawnTimer += dt;
        if (this.logSpawnTimer >= this.logSpawnInterval) {
          this.logSpawnTimer = 0;
          const lx = this.ladderXList[Math.floor(Math.random() * this.ladderXList.length)];
          this.logs.push({ x: lx, y: 20, speed: 3.2 + Math.random() * 1.6, rot: Math.random() * Math.PI, rotSpeed: 0.08 + Math.random() * 0.06 });
        }

        for (let i = this.logs.length - 1; i >= 0; i--) {
          const log = this.logs[i]; log.y += log.speed * dt; log.rot += log.rotSpeed * dt;
          if (log.y >= 430) {
            for (let j = 0; j < 8; j++) {
              const ang = -Math.PI * 0.1 - Math.random() * Math.PI * 0.8, sp = 1.8 + Math.random() * 3.8;
              this.particles.push({ x: log.x, y: 432, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, gravity: 0.2, size: 3 + Math.random() * 4, color: '#78350f', alpha: 1, life: 20 });
            }
            this.playSound('logBreak'); this.logs.splice(i, 1); continue;
          }
          const px = this.player.x, py = this.player.y - 24;
          if (px >= log.x - 30 && px <= log.x + 30 && py >= log.y - 25 && py <= log.y + 25) {
            this.setGameState('GAMEOVER'); this.playSound('hit'); return;
          }
        }
      }
      draw() {
        const ctx = this.ctx; ctx.clearRect(0, 0, this.vWidth, this.vHeight);
        const bgGrad = ctx.createLinearGradient(0, 0, 0, this.vHeight);
        bgGrad.addColorStop(0, '#090d16'); bgGrad.addColorStop(0.7, '#0f172a'); bgGrad.addColorStop(1, '#1e293b');
        ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, this.vWidth, this.vHeight);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        [[30, 30], [120, 70], [250, 40], [320, 100], [80, 150], [280, 180], [170, 90]].forEach(([sx, sy]) => ctx.fillRect(sx, sy, 2, 2));

        // 플랫폼 & 사다리
        ctx.fillStyle = '#22c55e'; ctx.fillRect(10, this.topY - 18, this.vWidth - 20, 18);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🏆 GOAL (정상 탈출구)', 180, this.topY - 5);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(0, this.bottomY, this.vWidth, this.vHeight - this.bottomY);
        ctx.strokeStyle = '#eab308'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, this.bottomY); ctx.lineTo(this.vWidth, this.bottomY); ctx.stroke();

        // 사다리 & 촘촘한 독립 발판 (Dense Rungs - 11px 간격)
        this.ladderXList.forEach(lx => {
          ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.moveTo(lx - 14, this.topY); ctx.lineTo(lx - 14, this.bottomY); ctx.moveTo(lx + 14, this.topY); ctx.lineTo(lx + 14, this.bottomY); ctx.stroke();
          ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 1.8;
          for (let y = this.topY + 8; y < this.bottomY; y += 11) { ctx.beginPath(); ctx.moveTo(lx - 13, y); ctx.lineTo(lx + 13, y); ctx.stroke(); }
        });

        // 통나무
        this.logs.forEach(log => {
          ctx.save(); ctx.translate(log.x, log.y); ctx.rotate(Math.sin(log.rot) * 0.15);
          ctx.fillStyle = '#78350f'; ctx.fillRect(-20, -11, 40, 22);
          ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 1.5; ctx.strokeRect(-20, -11, 40, 22);
          ctx.fillStyle = '#d97706'; ctx.beginPath(); ctx.ellipse(-17, 0, 3, 9, 0, 0, Math.PI*2); ctx.ellipse(17, 0, 3, 9, 0, 0, Math.PI*2); ctx.fill();
          ctx.restore();
        });

        // 파티클 & 텍스트
        this.particles.forEach(p => {
          ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        });
        this.floatingTexts.forEach(ft => {
          ctx.save(); ctx.globalAlpha = ft.alpha; ctx.fillStyle = ft.color;
          ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(ft.text, ft.x, ft.y); ctx.restore();
        });

        // 졸라맨
        const jumpArcY = this.player.isJumping ? -Math.sin(this.player.jumpProgress * Math.PI) * 16 : 0;
        ctx.save(); ctx.translate(this.player.x, this.player.y + jumpArcY);
        if (this.gameState === 'GAMEOVER') {
          ctx.rotate(this.player.fallAngle); ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.lineCap = 'round';
          ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(0, -44, 9, 0, Math.PI*2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, -35); ctx.lineTo(0, -18); ctx.stroke();
        } else if (this.gameState === 'VICTORY') {
          const t = this.player.danceTimer, bounce = Math.abs(Math.sin(t * 3)) * 6, sw = Math.cos(t * 3) * 6;
          ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 3; ctx.lineCap = 'round';
          ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(sw*0.5, -50 - bounce, 9, 0, Math.PI*2); ctx.fill(); ctx.stroke();
          ctx.font = '16px serif'; ctx.textAlign = 'center'; ctx.fillText('👑', sw*0.5, -61 - bounce);
          ctx.strokeStyle = '#f8fafc'; ctx.beginPath(); ctx.moveTo(sw*0.5, -41 - bounce); ctx.lineTo(0, -20 - bounce); ctx.stroke();
        } else {
          ctx.scale(this.player.facing, 1); ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 3; ctx.lineCap = 'round';
          const f = this.player.animFrame, isClimb = this.player.isClimbing || this.player.isFastDown, isJump = this.player.isJumping;
          ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(0, -48, 9, 0, Math.PI*2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#eab308'; ctx.beginPath(); ctx.arc(3, -49, 1.8, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.moveTo(0, -39); ctx.lineTo(0, -20); ctx.stroke();
          if (isJump) {
            ctx.beginPath(); ctx.moveTo(0, -38); ctx.lineTo(-14, -52); ctx.moveTo(0, -38); ctx.lineTo(14, -52); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-10, -12); ctx.lineTo(-6, -4); ctx.moveTo(0, -20); ctx.lineTo(10, -12); ctx.lineTo(6, -4); ctx.stroke();
          } else if (isClimb) {
            const limb = Math.sin(f * 2) * 10;
            ctx.beginPath(); ctx.moveTo(0, -38); ctx.lineTo(-12, -46 + limb); ctx.moveTo(0, -38); ctx.lineTo(12, -46 - limb); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-10, -10 - limb); ctx.lineTo(-12, 0); ctx.moveTo(0, -20); ctx.lineTo(10, -10 + limb); ctx.lineTo(12, 0); ctx.stroke();
          } else {
            ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-6, -10); ctx.lineTo(-8, 0); ctx.moveTo(0, -20); ctx.lineTo(6, -10); ctx.lineTo(8, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -38); ctx.lineTo(-10, -28); ctx.moveTo(0, -38); ctx.lineTo(10, -28); ctx.stroke();
          }
        }
        ctx.restore();
      }
    }

    const REGISTERED_GAMES = [
      {

      {

          author: 'Arcade Contributor',

          author: 'Antigravity Team',
          category: '아케이드 / 액션',
          icon: '🪜',
          thumbnailColor: 'linear-gradient(135deg, #eab308 0%, #854d0e 100%)'
        },
        GameClass: LadderClimbGamePlugin

    ];

    let currentGame = null;

    function initArcade() {
      const grid = document.getElementById('game-grid');
      document.getElementById('game-count').textContent = REGISTERED_GAMES.length;
      grid.innerHTML = '';

      REGISTERED_GAMES.forEach(({ meta, GameClass }) => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <div class="card-thumbnail" style="background: ${meta.thumbnailColor}">
            ${meta.icon}
          </div>
          <div class="card-body">
            <span class="card-category">${meta.category}</span>
            <h3 class="card-title">${meta.title}</h3>
            <p class="card-desc">${meta.description}</p>
            <div class="card-footer">
              <span>By ${meta.author}</span>
              <span class="play-badge">PLAY ▶</span>
            </div>
          </div>
        `;
        card.addEventListener('click', () => openModal(meta, GameClass));
        grid.appendChild(card);
      });

      document.getElementById('modal-close-btn').addEventListener('click', closeModal);
      document.getElementById('game-modal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('game-modal')) closeModal();
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });
    }

    function openModal(meta, GameClass) {
      closeModal();
      document.getElementById('modal-game-name').textContent = meta.title;
      document.getElementById('game-modal').classList.add('active');
      const container = document.getElementById('modal-game-container');
      currentGame = new GameClass();
      currentGame.mount(container);
    }

    function closeModal() {
      if (currentGame) {
        currentGame.unmount();
        currentGame = null;
      }
      document.getElementById('game-modal').classList.remove('active');
      document.getElementById('modal-game-container').innerHTML = '';
    }

    window.onload = initArcade;
  </script>
