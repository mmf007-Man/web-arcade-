    <style>
    /* ========================================================
       1. Base Lounge CSS
       ======================================================== */
    :root {
  --bg-main: #070a12;
  --bg-card: #131927;
  --bg-card-hover: #1c2539;
  --accent-neon: #38bdf8;
  --accent-purple: #a855f7;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --border-color: rgba(255, 255, 255, 0.08);
  --border-radius: 20px;
  --mobile-width: 430px;
  --mobile-aspect-ratio: 9 / 16;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-main);
  color: var(--text-primary);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}

/* 9:16 모바일 프레임 Wrapper */
.mobile-app-wrapper {
  width: 100%;
  max-width: var(--mobile-width);
  min-height: 100vh;
  min-height: 100dvh;
  height: 100dvh;
  background-color: #0b0f19;
  border-left: 1px solid var(--border-color);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
  position: relative;
  overflow: hidden;
}

@media (min-height: 700px) and (min-width: 480px) {
  body {
    padding: 20px 0;
  }
  .mobile-app-wrapper {
    min-height: calc(100vh - 40px);
    max-height: 920px;
    aspect-ratio: var(--mobile-aspect-ratio);
    border-radius: 36px;
    border: 2px solid rgba(56, 189, 248, 0.3);
  }
}

/* 상단 헤더 슬림화 */
.arcade-header {
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-color);
  padding: 12px 18px;
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.arcade-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.2rem;
  font-weight: 900;
  background: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.arcade-tagline {
  font-size: 0.72rem;
  color: var(--text-secondary);
}

.arcade-container {
  padding: 16px 14px;
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* 히어로 배너 */
.hero-banner {
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
  border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: var(--border-radius);
  padding: 16px;
}

.hero-title {
  font-size: 1.2rem;
  font-weight: 800;
  margin-bottom: 4px;
}

.hero-subtitle {
  color: var(--text-secondary);
  font-size: 0.78rem;
  line-height: 1.4;
}

/* 섹션 타이틀 */
.section-title {
  font-size: 1.05rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 게임 리스트 카드 */
.game-grid {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.game-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  flex-direction: row;
  height: 105px;
}

.game-card:active, .game-card:hover {
  transform: scale(0.98);
  border-color: var(--accent-neon);
  background: var(--bg-card-hover);
}

.card-thumbnail {
  width: 95px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.6rem;
  flex-shrink: 0;
}

.card-body {
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  flex: 1;
  overflow: hidden;
}

.card-category {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--accent-neon);
  text-transform: uppercase;
}

.card-title {
  font-size: 0.95rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-desc {
  font-size: 0.74rem;
  color: var(--text-secondary);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.7rem;
  color: var(--text-secondary);
}

.play-badge {
  background: rgba(56, 189, 248, 0.15);
  color: var(--accent-neon);
  padding: 3px 8px;
  border-radius: 12px;
  font-weight: 700;
}

/* 모달 오버레이 & 윈도우 슬림 반응형 */
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
  backdrop-filter: blur(8px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  padding: 8px;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-window {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);
  width: 100%;
  height: 100%;
  max-height: 98%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
}

.modal-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.modal-title {
  font-size: 0.98rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.modal-close-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 1.4rem;
  cursor: pointer;
  padding: 2px 6px;
}

.modal-content {
  padding: 8px 10px;
  overflow-y: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1;
}

    </style>

    <style id="style-dodge-poop">
    /* Game Style: dodge-poop */
    /* ========================================================
   똥 피하기 게임 (Avoid Poop Game) - Style Sheet
   ======================================================== */

.dp-game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color: #f8fafc;
}

/* 상단 헤더 & 상태창 */
.dp-header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(15, 23, 42, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 8px 14px;
  border-radius: 14px;
  margin-bottom: 10px;
  backdrop-filter: blur(8px);
}

.dp-score-box {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 1rem;
}

.dp-coin-icon {
  font-size: 1.2rem;
  animation: dp-coin-spin 2s linear infinite;
  display: inline-block;
}

@keyframes dp-coin-spin {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.dp-target-badge {
  font-size: 0.75rem;
  color: #94a3b8;
  background: rgba(255, 255, 255, 0.08);
  padding: 2px 6px;
  border-radius: 6px;
}

.dp-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.dp-sound-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #f8fafc;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
  transition: all 0.2s ease;
}

.dp-sound-btn:hover, .dp-sound-btn:active {
  background: rgba(56, 189, 248, 0.25);
  border-color: #38bdf8;
}

/* 목표치 프로그레스 바 */
.dp-progress-wrap {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 10px;
  position: relative;
}

.dp-progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #f59e0b, #fbbf24);
  border-radius: 999px;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
}

/* 캔버스 뷰포트 */
.dp-canvas-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  max-height: 440px;
  background: #0f172a;
  border: 2px solid rgba(56, 189, 248, 0.3);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.6);
}

.dp-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* 오버레이 (시작, 게임오버, 승리) */
.dp-overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.88);
  backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  text-align: center;
  z-index: 10;
  transition: opacity 0.25s ease;
}

.dp-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.dp-overlay-icon {
  font-size: 3.5rem;
  margin-bottom: 8px;
  animation: dp-bounce 1s ease-in-out infinite alternate;
}

@keyframes dp-bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-8px); }
}

.dp-overlay-title {
  font-size: 1.4rem;
  font-weight: 900;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.dp-overlay-desc {

}

.dp-btn-primary {

  border: none;
  padding: 12px 28px;
  font-size: 0.95rem;

  border-radius: 12px;

}

.dp-btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
}

.dp-btn-primary:active {
  transform: translateY(1px);
}

.dp-btn-victory {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
}

.dp-btn-victory:hover {
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
}

/* 모바일 가상 조작 버튼 패드 */
.dp-controls {
  width: 100%;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-top: 14px;
}

.dp-touch-btn {
  flex: 1;
  background: #1e293b;
  border: 2px solid #334155;

  border-radius: 14px;

.dp-touch-btn:active, .dp-touch-btn.active {

  color: #0f172a;
  border-color: #38bdf8;

  box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
}

.dp-keyboard-hint {
  font-size: 0.75rem;
  color: #64748b;
  margin-top: 8px;
  text-align: center;
}

    </style>

    // ========================================================

    const GamePlugin_minesweeper = (function() {
      const DIFFICULTY_PRESETS = {
  EASY: { rows: 9, cols: 9, mines: 10, label: '초급' },
  MEDIUM: { rows: 16, cols: 16, mines: 40, label: '중급' },
  HARD: { rows: 16, cols: 30, mines: 99, label: '상급' }
};

class MinesweeperGame {
  constructor(difficulty = DIFFICULTY_PRESETS.EASY) {
    this.setDifficulty(difficulty);
  }

  setDifficulty(preset) {
    this.rows = preset.rows;
    this.cols = preset.cols;
    this.totalMines = preset.mines;
    this.reset();
  }

  reset() {
    this.board = Array.from({ length: this.rows }, () =>
      Array.from({ length: this.cols }, () => ({
        isMine: false,
        isRevealed: false,
        isFlagged: false,
        neighborMines: 0
      }))
    );
    this.isFirstClick = true;
    this.isGameOver = false;
    this.isWin = false;
    this.flagCount = 0;
    this.revealedCount = 0;
  }

  generateMines(startRow, startCol) {
    let minesPlaced = 0;
    while (minesPlaced < this.totalMines) {
      const r = Math.floor(Math.random() * this.rows);
      const c = Math.floor(Math.random() * this.cols);

      const isStartArea = Math.abs(r - startRow) <= 1 && Math.abs(c - startCol) <= 1;

      if (!this.board[r][c].isMine && !isStartArea) {
        this.board[r][c].isMine = true;
        minesPlaced++;
      }
    }

    this.calculateNeighbors();
  }

  calculateNeighbors() {
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        if (this.board[r][c].isMine) continue;
        let count = 0;
        this.getNeighbors(r, c).forEach(([nr, nc]) => {
          if (this.board[nr][nc].isMine) count++;
        });
        this.board[r][c].neighborMines = count;
      }
    }
  }

  getNeighbors(r, c) {
    const neighbors = [];
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr;
        const nc = c + dc;
        if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
          neighbors.push([nr, nc]);
        }
      }
    }
    return neighbors;
  }

  revealCell(r, c) {
    if (this.isGameOver || this.board[r][c].isFlagged || this.board[r][c].isRevealed) {
      return false;
    }

    if (this.isFirstClick) {
      this.generateMines(r, c);
      this.isFirstClick = false;
    }

    const cell = this.board[r][c];
    cell.isRevealed = true;
    this.revealedCount++;

    if (cell.isMine) {
      this.isGameOver = true;
      this.isWin = false;
      this.revealAllMines();
      return true;
    }

    if (cell.neighborMines === 0) {
      const queue = [[r, c]];
      while (queue.length > 0) {
        const [cr, cc] = queue.shift();
        this.getNeighbors(cr, cc).forEach(([nr, nc]) => {
          const neighbor = this.board[nr][nc];
          if (!neighbor.isRevealed && !neighbor.isFlagged) {
            neighbor.isRevealed = true;
            this.revealedCount++;
            if (neighbor.neighborMines === 0) {
              queue.push([nr, nc]);
            }
          }
        });
      }
    }

    this.checkWinCondition();
    return true;
  }

  toggleFlag(r, c) {
    if (this.isGameOver || this.board[r][c].isRevealed) return;

    const cell = this.board[r][c];
    if (!cell.isFlagged && this.flagCount >= this.totalMines) return;

    cell.isFlagged = !cell.isFlagged;
    this.flagCount += cell.isFlagged ? 1 : -1;
  }

  revealAllMines() {
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        if (this.board[r][c].isMine) {
          this.board[r][c].isRevealed = true;
        }
      }
    }
  }

  checkWinCondition() {
    const totalNonMineCells = this.rows * this.cols - this.totalMines;
    if (this.revealedCount === totalNonMineCells) {
      this.isGameOver = true;
      this.isWin = true;
    }
  }
}


class GameTimer {
  constructor(onTick) {
    this.seconds = 0;
    this.intervalId = null;
    this.onTick = onTick;
  }

  start() {
    this.stop();
    this.seconds = 0;
    this.onTick(this.seconds);
    this.intervalId = setInterval(() => {
      this.seconds++;
      this.onTick(this.seconds);
    }, 1000);
  }

  stop() {
    if (this.intervalId) {
      clearInterval(this.intervalId);
      this.intervalId = null;
    }
  }

  reset() {
    this.stop();
    this.seconds = 0;
    this.onTick(this.seconds);
  }
}


class SoundEffects {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  playClick() {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.05);
  }

  playFlag() {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
    osc.frequency.setValueAtTime(800, this.ctx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.1);
  }

  playWin() {
    this.init();
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.1);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.1 + 0.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + i * 0.1);
      osc.stop(this.ctx.currentTime + i * 0.1 + 0.2);
    });
  }

  playExplosion() {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.3);
  }
}

const STORAGE_KEY = 'minesweeper_best_scores';

function getBestScores() {
  const data = localStorage.getItem(STORAGE_KEY);
  return data ? JSON.parse(data) : { EASY: null, MEDIUM: null, HARD: null };
}

function saveBestScore(difficultyKey, seconds) {
  const scores = getBestScores();
  if (scores[difficultyKey] === null || seconds < scores[difficultyKey]) {
    scores[difficultyKey] = seconds;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
    return true;
  }
  return false;
}

    const boardEl = this.container.querySelector('#ms-board');
    if (!boardEl) return;
    boardEl.style.gridTemplateColumns = `repeat(${this.game.cols}, 36px)`;
    boardEl.innerHTML = '';

    for (let r = 0; r < this.game.rows; r++) {
      for (let c = 0; c < this.game.cols; c++) {

        const cellEl = document.createElement('div');
        cellEl.className = 'ms-cell';
        cellEl.dataset.row = r;
        cellEl.dataset.col = c;

        if (cell.isRevealed) {
          cellEl.classList.add('revealed');
          if (cell.isMine) {
            cellEl.classList.add('mine');
            cellEl.textContent = '💣';
          } else if (cell.neighborMines > 0) {
            cellEl.dataset.count = cell.neighborMines;
            cellEl.textContent = cell.neighborMines;
          }
        } else if (cell.isFlagged) {
          cellEl.classList.add('flagged');
          cellEl.textContent = '🚩';
        }

        cellEl.addEventListener('click', () => this.handleCellClick(r, c));
        cellEl.addEventListener('contextmenu', (e) => {

          this.handleCellRightClick(r, c);
        });

        boardEl.appendChild(cellEl);

  handleCellClick(r, c) {
    if (this.game.isGameOver || this.game.board[r][c].isFlagged) return;

    if (this.game.isFirstClick) {

    }

    const wasSuccess = this.game.revealCell(r, c);

  stopGame() {

      this.dx = 0; this.dy = -1;
    } else if (e.key === 'ArrowDown' && this.dy === 0) {
      this.dx = 0; this.dy = 1;
    } else if (e.key === 'ArrowLeft' && this.dx === 0) {

    } else if (e.key === 'ArrowRight' && this.dx === 0) {

  }

    const head = { x: this.snake[0].x + this.dx, y: this.snake[0].y + this.dy };

    if (head.x < 0 || head.x >= this.tileCount || head.y < 0 || head.y >= this.tileCount) {
      this.gameOver();
      return;
    }

    for (let i = 0; i < this.snake.length; i++) {
      if (this.snake[i].x === head.x && this.snake[i].y === head.y) {
        this.gameOver();
        return;
      }
    }

    this.snake.unshift(head);

    if (head.x === this.food.x && head.y === this.food.y) {
      this.score += 10;
      this.updateScoreUI();
      this.placeFood();
    } else {

    }

  gameOver() {

  }

  updateScoreUI() {
    const scoreEl = this.container.querySelector('#snake-score');
    if (scoreEl) scoreEl.textContent = this.score;
  }

  draw() {
    this.ctx.fillStyle = '#0f172a';
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    this.ctx.fillStyle = '#ef4444';
    this.ctx.beginPath();
    this.ctx.arc(
      this.food.x * this.gridSize + this.gridSize / 2,
      this.food.y * this.gridSize + this.gridSize / 2,
      this.gridSize / 2 - 2,
      0,
      Math.PI * 2
    );
    this.ctx.fill();

    this.snake.forEach((part, index) => {
      this.ctx.fillStyle = index === 0 ? '#4ade80' : '#22c55e';
      this.ctx.fillRect(
        part.x * this.gridSize + 1,
        part.y * this.gridSize + 1,
        this.gridSize - 2,
        this.gridSize - 2
      );
    });
  }

// ========================================================
// 1. Web Audio API 신디사이저 사운드 매니저
// ========================================================
class SoundManager {
  constructor() {
    this.ctx = null;
    this.isMuted = false;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.isMuted = !this.isMuted;
    return this.isMuted;
  }

  playCoin() {
    if (this.isMuted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(987.77, now); // B5
    osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6

    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    osc.stop(now + 0.3);
  }

  playSplash() {
    if (this.isMuted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);

    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    osc.stop(now + 0.13);
  }

  playHit() {
    if (this.isMuted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);

    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    osc.stop(now + 0.42);
  }

  playVictory() {
    if (this.isMuted) return;
    this.init();
    if (!this.ctx) return;

    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    const now = this.ctx.currentTime;

    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, now + i * 0.12);

      gain.gain.setValueAtTime(0.12, now + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.25);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now + i * 0.12);
      osc.stop(now + i * 0.12 + 0.28);
    });
  }

  playClick() {
    if (this.isMuted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);

    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    osc.stop(now + 0.06);
  }
}

    this.player.x = this.vWidth / 2;
    this.player.y = 430;
    this.player.vx = 0;
    this.player.facing = 1;
    this.player.walkFrame = 0;
    this.player.fallAngle = 0;
    this.player.danceTimer = 0;

  updateUI() {
    this.scoreText.textContent = this.score;
    const progress = Math.min(100, (this.score / this.targetScore) * 100);
    this.progressBar.style.width = `${progress}%`;
  }

  startLoop() {
    if (!this.animId) {
      this.lastTime = 0;
      this.animId = requestAnimationFrame(this.loop);
    }
  }

  stopLoop() {
    if (this.animId) {
      cancelAnimationFrame(this.animId);
      this.animId = null;
    }
    this.lastTime = 0;
  }

  loop(timestamp) {
    if (!this.lastTime) this.lastTime = timestamp || performance.now();
    const elapsed = timestamp ? (timestamp - this.lastTime) : 16.667;
    this.lastTime = timestamp || performance.now();

    // 60 FPS (16.667ms = 1.0) 기준 Delta Time 계산
    // 탭 이동 후 재진입 시 급격한 위치 튐을 방지하기 위해 0.1 ~ 2.0 범위로 제한
    const dt = Math.min(2.0, Math.max(0.1, elapsed / 16.667));

    this.update(dt);
    this.draw();
    this.animId = requestAnimationFrame(this.loop);
  }

  // ========================================================
  // 3. 업데이트 로직
  // ========================================================
  update(dt = 1.0) {
    // 1. 파티클 및 텍스트 업데이트 (모든 상태에서 갱신)
    this.updateParticles(dt);
    this.updateFloatingTexts(dt);

    if (this.gameState === 'READY') {
      this.player.walkFrame += 0.05 * dt;
      return;
    }

    if (this.gameState === 'GAMEOVER') {
      if (this.player.fallAngle < Math.PI / 2) {
        this.player.fallAngle += 0.12 * dt;
      }
      return;
    }

    if (this.gameState === 'VICTORY') {
      this.player.danceTimer += 0.1 * dt;
      // 축하 컨페티 지속 생성
      if (Math.random() < 0.35 * dt) {
        this.createConfetti();
      }
      return;
    }

    // --- PLAYING 상태 ---
    // 플레이어 이동
    this.player.isMoving = false;
    if (this.keys.left) {
      this.player.x -= this.player.speed * dt;
      this.player.facing = -1;
      this.player.isMoving = true;
    }
    if (this.keys.right) {
      this.player.x += this.player.speed * dt;
      this.player.facing = 1;
      this.player.isMoving = true;
    }

    // 경계 제한
    const pMargin = 18;
    if (this.player.x < pMargin) this.player.x = pMargin;
    if (this.player.x > this.vWidth - pMargin) this.player.x = this.vWidth - pMargin;

    if (this.player.isMoving) {
      this.player.walkFrame += 0.25 * dt;
    } else {
      this.player.walkFrame = 0;
    }

    // 똥 스폰 & 이동
    this.poopSpawnTimer += dt;
    if (this.poopSpawnTimer >= this.poopSpawnInterval) {
      this.poopSpawnTimer = 0;
      this.spawnPoop();
    }

    for (let i = this.poops.length - 1; i >= 0; i--) {
      const p = this.poops[i];
      p.y += p.speed * dt;
      p.rotation += p.rotSpeed * dt;

      // 바닥 충돌 (y >= 430)
      if (p.y >= 424) {
        this.createPoopSplash(p.x, 428);
        this.sound.playSplash();
        this.poops.splice(i, 1);
        continue;
      }

      // 플레이어와 충돌 판정 (원-박스 / 히트박스 판정)
      // 졸라맨 히트박스: x: player.x - 12 ~ player.x + 12, y: 385 ~ 430
      const px = this.player.x;
      const py = 405; // 졸라맨 중심
      const dist = Math.hypot(p.x - px, p.y - py);

      if (dist < p.radius + 16) {
        if (this.player.hasUmbrella) {
          // ☂️ 우산이 똥을 1회 방어!
          this.player.hasUmbrella = false;
          this.createPoopSplash(p.x, p.y);
          this.createUmbrellaSparkle(px, py - 35);
          this.createFloatingText('☂️ 우산 방어!', px, py - 40, '#38bdf8');
          this.sound.playSplash();
          this.poops.splice(i, 1);
          continue;
        }

        // 피격! 게임 오버
        this.triggerGameOver();
        return;
      }
    }

    // 코인 스폰 & 이동
    this.coinSpawnTimer += dt;
    if (this.coinSpawnTimer >= this.coinSpawnInterval) {
      this.coinSpawnTimer = 0;
      this.spawnCoin();
    }

    for (let i = this.coins.length - 1; i >= 0; i--) {
      const c = this.coins[i];
      c.y += c.speed * dt;
      c.anim += 0.08 * dt;

      // 바닥에 닿으면 사라짐
      if (c.y >= 430) {
        this.coins.splice(i, 1);
        continue;
      }

      // 플레이어와 충돌 (코인 획득 - 우산은 코인을 통과시켜 정상 획득됨)
      const px = this.player.x;
      const py = 405;
      const dist = Math.hypot(c.x - px, c.y - py);

      if (dist < c.radius + 18) {
        this.score++;
        this.updateUI();
        this.sound.playCoin();
        this.createCoinSparkle(c.x, c.y);
        this.createFloatingText('+1', c.x, c.y, '#fbbf24');

        // 코인 10개마다 우산 보상 획득!
        if (this.score % 10 === 0 && this.score < this.targetScore) {
          this.player.hasUmbrella = true;
          this.sound.playVictory();
          this.createFloatingText('☂️ 우산 획득!', px, py - 40, '#38bdf8');
          this.createUmbrellaSparkle(px, py - 35);
        }

        this.coins.splice(i, 1);

        // 50점 달성 시 승리!
        if (this.score >= this.targetScore) {
          this.triggerVictory();
          return;
        }
      }
    }
  }

  spawnPoop() {
    // 똥 평균 낙하 속도를 살짝 높임 (2.5 ~ 4.4 px/frame, 평균 3.45 px/frame)
    const speed = 2.5 + Math.random() * 1.9;
    const radius = 13 + Math.random() * 5;
    const x = radius + Math.random() * (this.vWidth - radius * 2);

    this.poops.push({
      x,
      y: -20,
      radius,
      speed,
      rotation: Math.random() * Math.PI,
      rotSpeed: (Math.random() - 0.5) * 0.04
    });
  }

  spawnCoin() {
    const speed = 1.8 + Math.random() * 1.2; // 부드럽고 가볍게 하강
    const radius = 12;
    const x = radius + Math.random() * (this.vWidth - radius * 2);

    this.coins.push({
      x,
      y: -20,
      radius,
      speed,
      anim: Math.random() * Math.PI
    });
  }

  createPoopSplash(x, y) {
    // 바닥에 똥이 철퍽 닿을 때 튀기는 갈색 파티클
    for (let i = 0; i < 9; i++) {
      const angle = -Math.PI * 0.1 - Math.random() * Math.PI * 0.8;
      const speed = 1.5 + Math.random() * 3.5;
      this.particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity: 0.2,
        size: 3 + Math.random() * 4,
        color: Math.random() > 0.4 ? '#854d0e' : '#713f12',
        alpha: 1,
        life: 20 + Math.random() * 10
      });
    }
  }

  createUmbrellaSparkle(x, y) {
    for (let i = 0; i < 14; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 4;
      this.particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity: 0.05,
        size: 3 + Math.random() * 4,
        color: Math.random() > 0.5 ? '#38bdf8' : '#818cf8',
        alpha: 1,
        life: 25 + Math.random() * 15
      });
    }
  }

  createCoinSparkle(x, y) {
    for (let i = 0; i < 12; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 4;
      this.particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity: 0.1,
        size: 3 + Math.random() * 3,
        color: Math.random() > 0.5 ? '#fde047' : '#fbbf24',
        alpha: 1,
        life: 25 + Math.random() * 15
      });
    }
  }

  createConfetti() {
    const colors = ['#f43f5e', '#3b82f6', '#10b981', '#fbbf24', '#a855f7', '#ec4899'];
    const x = Math.random() * this.vWidth;
    this.particles.push({
      x,
      y: -10,
      vx: (Math.random() - 0.5) * 3,
      vy: 2 + Math.random() * 3,
      gravity: 0.05,
      size: 4 + Math.random() * 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      life: 60 + Math.random() * 30,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.2
    });
  }

  createFloatingText(text, x, y, color) {
    this.floatingTexts.push({
      text,
      x,
      y,
      vy: -1.5,
      alpha: 1,
      color,
      life: 30
    });
  }

  updateParticles(dt = 1.0) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += (p.gravity || 0) * dt;
      if (p.rot !== undefined) p.rot += (p.vRot || 0) * dt;
      p.life -= dt;
      p.alpha = Math.max(0, p.life / 30);

      if (p.life <= 0) {
        this.particles.splice(i, 1);
      }
    }
  }

  updateFloatingTexts(dt = 1.0) {
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.y += ft.vy * dt;
      ft.life -= dt;
      ft.alpha = Math.max(0, ft.life / 30);

      if (ft.life <= 0) {
        this.floatingTexts.splice(i, 1);
      }
    }
  }

  triggerGameOver() {
    this.setGameState('GAMEOVER');
    this.sound.playHit();
    this.container.querySelector('#dp-result-gameover').textContent = `획득 코인: ${this.score} / ${this.targetScore}개`;
  }

  triggerVictory() {
    this.setGameState('VICTORY');
    this.sound.playVictory();
    for (let i = 0; i < 40; i++) {
      this.createConfetti();
    }
  }

  // ========================================================
  // 4. 렌더링 시스템
  // ========================================================
  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.vWidth, this.vHeight);

    // 1. 배경 (그라데이션 밤하늘 + 그리드 바닥)
    this.drawBackground(ctx);

    // 2. 바닥 착지선
    this.drawGround(ctx);

    // 3. 똥 그리기
    this.poops.forEach(p => this.drawPoop(ctx, p));

    // 4. 코인 그리기
    this.coins.forEach(c => this.drawCoin(ctx, c));

    // 5. 파티클 그리기
    this.drawParticles(ctx);

    // 6. 플레이어 (졸라맨) 그리기
    this.drawStickman(ctx);

    // 7. 플로팅 텍스트 그리기
    this.drawFloatingTexts(ctx);
  }

  drawBackground(ctx) {
    // 밤하늘 배경
    const bgGrad = ctx.createLinearGradient(0, 0, 0, this.vHeight);
    bgGrad.addColorStop(0, '#090d16');
    bgGrad.addColorStop(0.7, '#0f172a');
    bgGrad.addColorStop(1, '#1e293b');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, this.vWidth, this.vHeight);

    // 은은한 별빛
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    const stars = [
      [30, 40], [120, 80], [250, 45], [320, 110], [70, 160], [290, 190], [180, 70]
    ];
    stars.forEach(([sx, sy]) => {
      ctx.fillRect(sx, sy, 2, 2);
    });
  }

  drawGround(ctx) {
    const groundY = 430;

    // 바닥 라인
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(this.vWidth, groundY);
    ctx.stroke();

    // 바닥 채우기
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, groundY, this.vWidth, this.vHeight - groundY);

    // 바닥 그리드 패턴
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
    ctx.lineWidth = 1;
    for (let x = 0; x < this.vWidth; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, groundY);
      ctx.lineTo(x, this.vHeight);
      ctx.stroke();
    }
  }

  drawPoop(ctx, p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);

    const r = p.radius;

    // 똥 기본 덩어리 층 (3단 소용돌이 모양)
    // 1단 (하단)
    ctx.fillStyle = '#854d0e';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.4, r * 1.1, r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 2단 (중단)
    ctx.fillStyle = '#92400e';
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.1, r * 0.85, r * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();

    // 3단 꼭지 (상단 뿔)
    ctx.fillStyle = '#78350f';
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, -r * 0.2);
    ctx.quadraticCurveTo(0, -r * 1.2, r * 0.4, -r * 1.1);
    ctx.quadraticCurveTo(r * 0.2, -r * 0.5, r * 0.5, -r * 0.2);
    ctx.fill();

    // 귀여운 눈망울
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-r * 0.35, -r * 0.05, r * 0.22, 0, Math.PI * 2);
    ctx.arc(r * 0.35, -r * 0.05, r * 0.22, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(-r * 0.35 + 1, -r * 0.05, r * 0.12, 0, Math.PI * 2);
    ctx.arc(r * 0.35 + 1, -r * 0.05, r * 0.12, 0, Math.PI * 2);
    ctx.fill();

    // 윤기 하이라이트
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.beginPath();
    ctx.arc(-r * 0.5, r * 0.2, r * 0.15, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  drawCoin(ctx, c) {
    ctx.save();
    ctx.translate(c.x, c.y);

    // 3D 회전 스케일 효과
    const scaleX = Math.cos(c.anim);
    ctx.scale(Math.abs(scaleX) < 0.15 ? 0.15 : scaleX, 1);

    const r = c.radius;

    // 외부 금빛 광채
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 10;

    // 코인 테두리 & 본체
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.82, 0, Math.PI * 2);
    ctx.fill();

    // 내부 $ 마크 또는 별
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#b45309';
    ctx.font = `bold ${Math.floor(r * 1.1)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', 0, 1);

    ctx.restore();
  }

  drawParticles(ctx) {
    this.particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      if (p.rot !== undefined) {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
  }

  drawFloatingTexts(ctx) {
    this.floatingTexts.forEach(ft => {
      ctx.save();
      ctx.globalAlpha = ft.alpha;
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 16px "JetBrains Mono", Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 4;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    });
  }

  // ========================================================
  // 5. 졸라맨(Stickman) 렌더링 & 애니메이션
  // ========================================================
  drawStickman(ctx) {
    ctx.save();
    const p = this.player;

    ctx.translate(p.x, p.y);

    // 상태에 따른 렌더링 분기
    if (this.gameState === 'GAMEOVER') {
      this.drawDeadStickman(ctx);
    } else if (this.gameState === 'VICTORY') {
      this.drawDancingStickman(ctx);
    } else {
      this.drawActiveStickman(ctx);
    }

    ctx.restore();
  }

  // 기본 달리기 / 대기 상태 졸라맨
  drawActiveStickman(ctx) {
    const p = this.player;
    ctx.scale(p.facing, 1); // 좌우 반전

    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const isRun = p.isMoving;
    const frame = p.walkFrame;

    // 호흡 바운스
    const bounceY = isRun ? Math.abs(Math.sin(frame)) * 4 : Math.sin(frame) * 2;

    // 신체 관절 좌표 계산 (발바닥 Y = 0 기준)
    const hipY = -22 - bounceY;
    const spineTopY = -42 - bounceY;
    const headCenterY = -52 - bounceY;

    // 1. 머리 (원)
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(0, headCenterY, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 표정 (눈 & 입)
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(3, headCenterY - 1, 1.8, 0, Math.PI * 2); // 눈
    ctx.fill();

    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (isRun) {
      // 달릴 때 비장한 입
      ctx.moveTo(1, headCenterY + 4);
      ctx.lineTo(5, headCenterY + 3);
    } else {
      // 대기 시 미소 입
      ctx.arc(2, headCenterY + 2, 3, 0.1, Math.PI * 0.8);
    }
    ctx.stroke();

    // 2. 몸통 (척추)
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, headCenterY + 9);
    ctx.lineTo(0, hipY);
    ctx.stroke();

    // 3. 다리 (앞다리 & 뒷다리 관절 애니메이션)
    const legSwing = isRun ? Math.sin(frame) * 0.8 : 0;

    // 앞다리 (골반 -> 무릎 -> 발)
    const knee1X = Math.sin(legSwing) * 10 + (isRun ? 4 : 2);
    const knee1Y = hipY + 12;
    const foot1X = Math.sin(legSwing) * 16 + (isRun ? 6 : 4);
    const foot1Y = 0;

    ctx.beginPath();
    ctx.moveTo(0, hipY);
    ctx.lineTo(knee1X, knee1Y);
    ctx.lineTo(foot1X, foot1Y);
    ctx.stroke();

    // 뒷다리
    const knee2X = -Math.sin(legSwing) * 10 - (isRun ? 4 : 2);
    const knee2Y = hipY + 12;
    const foot2X = -Math.sin(legSwing) * 16 - (isRun ? 6 : 4);
    const foot2Y = 0;

    ctx.beginPath();
    ctx.moveTo(0, hipY);
    ctx.lineTo(knee2X, knee2Y);
    ctx.lineTo(foot2X, foot2Y);
    ctx.stroke();

    // 4. 팔 (앞팔 & 뒷팔 스윙)
    const armSwing = isRun ? -Math.sin(frame) * 0.9 : Math.sin(frame * 0.5) * 0.2;
    const shoulderY = spineTopY + 3;

    // 앞팔
    const hand1X = Math.sin(armSwing) * 14 + (isRun ? 6 : 3);
    const hand1Y = shoulderY + 12 + Math.cos(armSwing) * 4;
    ctx.beginPath();
    ctx.moveTo(0, shoulderY);
    ctx.lineTo(hand1X * 0.6, shoulderY + 7);
    ctx.lineTo(hand1X, hand1Y);
    ctx.stroke();

    // 뒷팔
    const hand2X = -Math.sin(armSwing) * 14 - (isRun ? 6 : 3);
    const hand2Y = shoulderY + 12 - Math.cos(armSwing) * 4;
    ctx.beginPath();
    ctx.moveTo(0, shoulderY);
    ctx.lineTo(hand2X * 0.6, shoulderY + 7);
    ctx.lineTo(hand2X, hand2Y);
    ctx.stroke();

    // 5. ☂️ 우산 렌더링 (hasUmbrella 일 때 머리 위 방어 우산)
    if (p.hasUmbrella) {
      ctx.save();
      const umbY = headCenterY - 14;

      // 우산 신비로운 네온 푸른빛 아우라
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 14;

      // 우산 돔 그라데이션
      const umbGrad = ctx.createLinearGradient(0, umbY - 22, 0, umbY);
      umbGrad.addColorStop(0, '#38bdf8');
      umbGrad.addColorStop(1, '#0284c7');
      ctx.fillStyle = umbGrad;

      ctx.beginPath();
      ctx.arc(0, umbY, 26, Math.PI * 1.05, Math.PI * 1.95);
      ctx.closePath();
      ctx.fill();

      // 우산 하단 곡선 굴곡
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const startX = -26 + i * 13;
        ctx.arc(startX + 6.5, umbY, 6.5, Math.PI, 0, true);
      }
      ctx.fill();

      // 우산 골선
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, umbY, 26, Math.PI * 1.05, Math.PI * 1.95);
      ctx.stroke();

      // 우산 손잡이 댓살 (손 위치까지)
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, umbY);
      ctx.lineTo(0, headCenterY + 4);
      ctx.stroke();

      // 우산 꼭지 팁
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, umbY - 26, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // 똥 맞고 쓰러진 졸라맨
  drawDeadStickman(ctx) {
    const angle = this.player.fallAngle;
    ctx.rotate(angle); // 쓰러지는 모션

    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    const hipY = -20;
    const headCenterY = -48;

    // 머리
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(0, headCenterY, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // X X 눈표정
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 1.8;
    // 왼쪽 눈 X
    ctx.beginPath();
    ctx.moveTo(-5, headCenterY - 4); ctx.lineTo(-1, headCenterY);
    ctx.moveTo(-1, headCenterY - 4); ctx.lineTo(-5, headCenterY);
    // 오른쪽 눈 X
    ctx.moveTo(1, headCenterY - 4); ctx.lineTo(5, headCenterY);
    ctx.moveTo(5, headCenterY - 4); ctx.lineTo(1, headCenterY);
    ctx.stroke();

    // 입 벌린 표정 O
    ctx.beginPath();
    ctx.arc(0, headCenterY + 4, 2, 0, Math.PI * 2);
    ctx.stroke();

    // 머리 위에 얹어진 똥 모자 💩
    ctx.font = '16px serif';
    ctx.textAlign = 'center';
    ctx.fillText('💩', 0, headCenterY - 10);

    // 몸통
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, headCenterY + 9);
    ctx.lineTo(0, hipY);
    ctx.stroke();

    // 축 늘어진 팔다리
    // 다리
    ctx.beginPath();
    ctx.moveTo(0, hipY); ctx.lineTo(-8, -5); ctx.lineTo(-12, 0);
    ctx.moveTo(0, hipY); ctx.lineTo(8, -5); ctx.lineTo(14, 0);
    // 팔
    ctx.moveTo(0, -36); ctx.lineTo(-14, -28);

      const sx = Math.cos(sAng) * 16;
      const sy = headCenterY - 14 + Math.sin(sAng) * 5;

    const danceStep = Math.sin(t * 3);
    const sideSwing = Math.cos(t * 3) * 6;

    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const bounce = Math.abs(Math.sin(t * 3)) * 6;

    ctx.lineTo(sideSwing * 0.5 - 2, headCenterY - 1);
    ctx.lineTo(sideSwing * 0.5 - 5, headCenterY + 1);
    // 오른쪽 눈 <

    ctx.lineTo(sideSwing * 0.5 + 2, headCenterY - 1);
    ctx.lineTo(sideSwing * 0.5 + 5, headCenterY + 1);

    ctx.lineTo(-24, armL_Y - 8);

    ctx.lineTo(16, armR_Y);
    ctx.lineTo(24, armR_Y - 8);

    ctx.moveTo(0, hipY);
    ctx.lineTo(legL_X * 0.7, hipY + 12);
    ctx.lineTo(legL_X, -legL_Y);

    ctx.moveTo(0, hipY);
    ctx.lineTo(legR_X * 0.7, hipY + 12);
    ctx.lineTo(legR_X, -legR_Y);
    ctx.stroke();
  }
}

    const GamePlugin_tetris = (function() {
      const meta = {
  id: 'tetris',
  title: '테트리스 (Tetris)',
  description: '블록을 회전시키고 가득 채워 줄을 지워보세요! 터치 스크롤 차단 & 민감한 고성능 드래그 조작 지원',

  icon: '🧱',
  thumbnailColor: 'linear-gradient(135deg, #a855f7 0%, #581c87 100%)',
  version: '1.4.0'
};

const COLS = 10;
const ROWS = 20;
const BLOCK_SIZE = 18;

const SHAPES = [
  [],
  [[1, 1, 1, 1]],         // I (Cyan)
  [[1, 0, 0], [1, 1, 1]], // J (Blue)
  [[0, 0, 1], [1, 1, 1]], // L (Orange)
  [[1, 1], [1, 1]],       // O (Yellow)
  [[0, 1, 1], [1, 1, 0]], // S (Green)
  [[0, 1, 0], [1, 1, 1]], // T (Purple)
  [[1, 1, 0], [0, 1, 1]]  // Z (Red)
];

const COLORS = [
  'none',
  '#06b6d4',
  '#3b82f6',
  '#f97316',
  '#eab308',
  '#22c55e',
  '#a855f7',
  '#ef4444'
];

class Game {
  constructor() {
    this.container = null;
    this.canvas = null;
    this.ctx = null;
    this.nextCanvas = null;
    this.nextCtx = null;
    this.board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    this.score = 0;
    this.lines = 0;
    this.currentPiece = null;
    this.nextPiece = null;
    this.gameInterval = null;
    this.isGameOver = false;

    // 터치 민감 드래그 상태
    this.touchStartX = 0;
    this.touchStartY = 0;
    this.lastDragX = 0;
    this.touchStartTime = 0;
    this.isDragging = false;

    this.handleKeyDown = this.handleKeyDown.bind(this);
    this.handleTouchStart = this.handleTouchStart.bind(this);
    this.handleTouchMove = this.handleTouchMove.bind(this);
    this.handleTouchEnd = this.handleTouchEnd.bind(this);
  }

  loadStyle() {
    if (!document.getElementById('style-tetris')) {
      const link = document.createElement('link');
      link.id = 'style-tetris';
      link.rel = 'stylesheet';
      link.href = new URL('./style.css', window.location.href).href;
      document.head.appendChild(link);
    }
  }

  mount(container) {
    this.loadStyle();
    this.container = container;
    this.initUI();
    this.resetGame();
  }

  unmount() {
    this.stopGame();
    window.removeEventListener('keydown', this.handleKeyDown);
    if (this.canvas) {
      this.canvas.removeEventListener('touchstart', this.handleTouchStart);
      this.canvas.removeEventListener('touchmove', this.handleTouchMove);
      this.canvas.removeEventListener('touchend', this.handleTouchEnd);
    }
    if (this.container) {
      this.container.innerHTML = '';
    }
  }

  initUI() {
    this.container.innerHTML = `
      <div class="tetris-container">
        <div class="tetris-dashboard">
          <div class="tetris-score-info">
            <span>점수: <span id="t-score">0</span></span>
            <span>줄: <span id="t-lines">0</span></span>
          </div>
          <div class="tetris-next-box">
            <span>NEXT</span>
            <canvas id="tetris-next-canvas" width="60" height="60" class="tetris-next-canvas"></canvas>
          </div>
        </div>

        <canvas id="tetris-canvas" width="180" height="360" class="tetris-canvas"></canvas>

        <div class="tetris-gesture-guide">
          <p>👇 <b>스마트폰 터치 조작 안내</b></p>
          <ul>
            <li>👈👉 <b>손가락 좌우 드래그</b>: 블록 실시간 연속 이동</li>
            <li>👆 <b>가벼운 탭</b>: 블록 회전</li>
            <li>👇 <b>아래로 쓸어내리기</b>: 하드 드롭</li>
          </ul>
        </div>

        <button class="t-btn-wide" id="t-btn-restart">다시 시작</button>
      </div>
    `;

    this.canvas = this.container.querySelector('#tetris-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.nextCanvas = this.container.querySelector('#tetris-next-canvas');
    this.nextCtx = this.nextCanvas.getContext('2d');

    this.container.querySelector('#t-btn-restart').addEventListener('click', () => this.resetGame());

    // 스마트폰 스크롤 차단 및 터치 드래그 이벤트 (non-passive)
    this.canvas.addEventListener('touchstart', this.handleTouchStart, { passive: false });
    this.canvas.addEventListener('touchmove', this.handleTouchMove, { passive: false });
    this.canvas.addEventListener('touchend', this.handleTouchEnd, { passive: false });

    window.addEventListener('keydown', this.handleKeyDown);
  }

  handleTouchStart(e) {
    if (this.isGameOver) return;
    if (e.cancelable) e.preventDefault();
    const touch = e.touches[0];
    this.touchStartX = touch.clientX;
    this.touchStartY = touch.clientY;
    this.lastDragX = touch.clientX;
    this.touchStartTime = Date.now();
    this.isDragging = true;
  }

  handleTouchMove(e) {
    if (this.isGameOver || !this.isDragging) return;
    if (e.cancelable) e.preventDefault(); // 웹 브라우저 스크롤 완전 차단
    const touch = e.touches[0];
    const deltaX = touch.clientX - this.lastDragX;
    const dragThreshold = 10; // 10px로 민감도 향상

    if (deltaX > dragThreshold) {
      const steps = Math.floor(deltaX / dragThreshold);
      for (let i = 0; i < steps; i++) {
        this.moveRight();
      }
      this.lastDragX = touch.clientX;
    } else if (deltaX < -dragThreshold) {
      const steps = Math.floor(Math.abs(deltaX) / dragThreshold);
      for (let i = 0; i < steps; i++) {
        this.moveLeft();
      }
      this.lastDragX = touch.clientX;
    }
  }

  handleTouchEnd(e) {
    if (this.isGameOver) return;
    if (e.cancelable) e.preventDefault();
    this.isDragging = false;
    const touch = e.changedTouches[0];
    const totalDeltaX = touch.clientX - this.touchStartX;
    const totalDeltaY = touch.clientY - this.touchStartY;
    const duration = Date.now() - this.touchStartTime;

    // 아래로 빠른 스와이프 -> 하드 드롭
    if (totalDeltaY > 30 && Math.abs(totalDeltaY) > Math.abs(totalDeltaX)) {
      this.hardDrop();
    } else if (Math.abs(totalDeltaX) < 8 && Math.abs(totalDeltaY) < 8 && duration < 250) {
      // 제자리 탭 -> 회전
      this.rotate();
    }
  }

  resetGame() {
    this.stopGame();
    this.board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    this.score = 0;
    this.lines = 0;
    this.isGameOver = false;
    this.nextPiece = this.generateRandomPiece();
    this.updateScoreUI();
    this.spawnPiece();
    this.gameInterval = setInterval(() => this.moveDown(), 500);
  }

  stopGame() {
    if (this.gameInterval) {
      clearInterval(this.gameInterval);
      this.gameInterval = null;
    }
  }

  generateRandomPiece() {
    const typeId = Math.floor(Math.random() * 7) + 1;
    const shape = SHAPES[typeId];
    return {
      typeId,
      shape,
      x: Math.floor((COLS - shape[0].length) / 2),
      y: 0
    };
  }

  spawnPiece() {
    this.currentPiece = this.nextPiece;
    this.nextPiece = this.generateRandomPiece();

    if (this.checkCollision(this.currentPiece.x, this.currentPiece.y, this.currentPiece.shape)) {
      this.isGameOver = true;
      this.stopGame();
      alert(`🎮 Game Over! 최종 점수: ${this.score}`);
    }

    this.drawNextPiece();
  }

  handleKeyDown(e) {
    if (this.isGameOver) return;
    if (e.key === 'ArrowLeft') {
      this.moveLeft();
    } else if (e.key === 'ArrowRight') {
      this.moveRight();
    } else if (e.key === 'ArrowDown') {
      this.moveDown();
    } else if (e.key === 'ArrowUp' || e.key === 'z') {
      this.rotate();
    } else if (e.key === ' ') {
      e.preventDefault();
      this.hardDrop();
    }
  }

  moveLeft() {
    if (!this.checkCollision(this.currentPiece.x - 1, this.currentPiece.y, this.currentPiece.shape)) {
      this.currentPiece.x--;
      this.draw();
    }
  }

  moveRight() {
    if (!this.checkCollision(this.currentPiece.x + 1, this.currentPiece.y, this.currentPiece.shape)) {
      this.currentPiece.x++;
      this.draw();
    }
  }

  moveDown() {
    if (!this.checkCollision(this.currentPiece.x, this.currentPiece.y + 1, this.currentPiece.shape)) {
      this.currentPiece.y++;
      this.draw();
    } else {
      this.lockPiece();
      this.clearLines();
      this.spawnPiece();
      this.draw();
    }
  }

  hardDrop() {
    while (!this.checkCollision(this.currentPiece.x, this.currentPiece.y + 1, this.currentPiece.shape)) {
      this.currentPiece.y++;
    }
    this.lockPiece();
    this.clearLines();
    this.spawnPiece();
    this.draw();
  }

  rotate() {
    const rotated = this.currentPiece.shape[0].map((_, i) =>
      this.currentPiece.shape.map(row => row[i]).reverse()
    );
    if (!this.checkCollision(this.currentPiece.x, this.currentPiece.y, rotated)) {
      this.currentPiece.shape = rotated;
      this.draw();
    }
  }

  checkCollision(x, y, shape) {
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          const newX = x + c;
          const newY = y + r;
          if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
          if (newY >= 0 && this.board[newY][newX] !== 0) return true;
        }
      }
    }
    return false;
  }

  getGhostY() {
    if (!this.currentPiece) return 0;
    let ghostY = this.currentPiece.y;
    while (!this.checkCollision(this.currentPiece.x, ghostY + 1, this.currentPiece.shape)) {
      ghostY++;
    }
    return ghostY;
  }

  lockPiece() {
    const { x, y, shape, typeId } = this.currentPiece;
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          if (y + r >= 0) {
            this.board[y + r][x + c] = typeId;
          }
        }
      }
    }
  }

  clearLines() {
    let linesCleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (this.board[r].every(cell => cell !== 0)) {
        this.board.splice(r, 1);
        this.board.unshift(Array(COLS).fill(0));
        linesCleared++;
        r++;
      }
    }

    if (linesCleared > 0) {
      const scoreMap = [0, 100, 300, 500, 800];
      this.score += scoreMap[linesCleared] || linesCleared * 200;
      this.lines += linesCleared;
      this.updateScoreUI();
    }
  }

  updateScoreUI() {
    const scoreEl = this.container.querySelector('#t-score');
    const linesEl = this.container.querySelector('#t-lines');
    if (scoreEl) scoreEl.textContent = this.score;
    if (linesEl) linesEl.textContent = this.lines;
  }

  drawNextPiece() {
    if (!this.nextPiece || !this.nextCtx) return;
    this.nextCtx.fillStyle = '#0f172a';
    this.nextCtx.fillRect(0, 0, this.nextCanvas.width, this.nextCanvas.height);

    const shape = this.nextPiece.shape;
    const color = COLORS[this.nextPiece.typeId];
    const size = 12;
    const offsetX = (this.nextCanvas.width - shape[0].length * size) / 2;
    const offsetY = (this.nextCanvas.height - shape.length * size) / 2;

    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          this.nextCtx.fillStyle = color;
          this.nextCtx.fillRect(offsetX + c * size, offsetY + r * size, size - 1, size - 1);
        }
      }
    }
  }

  draw() {
    this.ctx.fillStyle = '#0f172a';
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        this.ctx.strokeRect(c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
      }
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {

        for (let c = 0; c < shape[r].length; c++) {

    }

    if (this.currentPiece) {
      const { x, y, shape, typeId } = this.currentPiece;
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[r].length; c++) {
          if (shape[r][c]) {
            this.drawBlock(x + c, y + r, COLORS[typeId], 1.0);
          }
        }
      }
    }
  }

  drawGhostBlock(x, y, color) {
    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    this.ctx.fillRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
    this.ctx.strokeStyle = color;
    this.ctx.lineWidth = 1.5;
    this.ctx.strokeRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
  }

  drawBlock(x, y, color, alpha = 1.0) {
    this.ctx.save();
    this.ctx.globalAlpha = alpha;
    this.ctx.fillStyle = color;
    this.ctx.fillRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    this.ctx.lineWidth = 1;
    this.ctx.strokeRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
    this.ctx.restore();
  }
}
