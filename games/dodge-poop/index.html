<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💩 똥 피하기 게임 (Avoid Poop)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070a12;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: 'Pretendard', sans-serif;
    }
    .game-wrapper {
      width: 100%;
      max-width: 400px;
      background: #0b0f19;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <div class="game-wrapper" id="game-app"></div>

  <script type="module">
    import { Game } from './index.js';
    const appContainer = document.getElementById('game-app');
    const game = new Game();
    game.mount(appContainer);
  </script>
</body>
</html>
